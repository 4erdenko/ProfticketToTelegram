name: Test. Build. Deploy.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (lint and format checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.22'
          python-version: '3.14.8'
          enable-cache: true

      - name: Ruff lint
        run: uv run --locked ruff check --output-format=github .

      - name: Ruff format check
        run: uv run --locked ruff format --check --diff .

  build-test:
    name: Tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.22'
          python-version: '3.14.8'
          enable-cache: true

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build current checkout
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false

  build-push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [ruff, build-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/profticket_to_tg:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/profticket_to_tg:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Copy Compose files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.yml,docker-compose.mosbilet.yml'
          target: '${{ secrets.FOLDER_PATH }}'

      - name: Apply migrations and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd '${{ secrets.FOLDER_PATH }}'
            test -s .my_local_dev/mosbilet-proxy/bot.env
            umask 077
            cat <<'EOF' > .env
            ${{ secrets.ENV }}
            EOF
            compose() {
              sudo env MOSBILET_BOT_IMAGE='${{ secrets.DOCKERHUB_USERNAME }}/profticket_to_tg:${{ github.sha }}' \
                docker compose --env-file .env \
                --env-file .my_local_dev/mosbilet-proxy/bot.env \
                -f docker-compose.yml -f docker-compose.mosbilet.yml "$@"
            }
            compose config --quiet
            compose pull profticket_bot_service
            compose run --rm --no-deps profticket_bot_service alembic upgrade head
            compose up -d --no-deps profticket_bot_service
            sudo docker image prune -f
