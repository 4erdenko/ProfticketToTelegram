services:
  profticket_bot_service:
    image: ${MOSBILET_BOT_IMAGE:?Set the tested bot image tag}
    pull_policy: always
    environment:
      SCHEDULE_SOURCE: ermolova
      MOSBILET_PROXY_URL: ${MOSBILET_PROXY_URL:?Set the authenticated HTTPS proxy URL}
      MOSBILET_PROXY_CA_FILE: /run/secrets/mosbilet-proxy.crt
    volumes:
      - type: bind
        source: ${MOSBILET_PROXY_CA_HOST_FILE:?Set the absolute proxy certificate path}
        target: /run/secrets/mosbilet-proxy.crt
        read_only: true
        bind:
          create_host_path: false
